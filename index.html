<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>追剧字幕</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0c0c0f; --text: #e8e2d9; --dim: rgba(232,226,217,0.4);
  --gold: #c8a96e; --border: rgba(255,255,255,0.08); --surface: rgba(255,255,255,0.05);
}
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Noto Serif SC', serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { height: 100vh; position: relative; }

/* screens */
.screen { position: absolute; inset: 0; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; }
.screen.active { opacity: 1; pointer-events: all; }

/* ── HOME ── */
#home { justify-content: center; align-items: center; padding: 48px 28px; gap: 32px; }
.logo { font-size: 26px; font-weight: 300; letter-spacing: 3px; text-align: center; line-height: 1.6; }
.stats { display: flex; gap: 20px; }
.stat { text-align: center; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 20px; min-width: 80px; }
.stat-n { font-size: 30px; font-weight: 600; color: var(--gold); line-height: 1; }
.stat-l { font-size: 11px; color: var(--dim); margin-top: 4px; }
.home-btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }

/* ── BUTTONS ── */
.btn { width: 100%; padding: 15px; border: none; border-radius: 12px;
  font-family: 'Noto Serif SC', serif; font-size: 15px; cursor: pointer;
  transition: opacity 0.15s, transform 0.15s; }
.btn:active { opacity: 0.7; transform: scale(0.98); }
.btn-gold { background: var(--gold); color: #0c0c0f; font-weight: 600; }
.btn-dim { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-ghost { background: none; color: var(--dim); border: 1px solid var(--border); font-size: 13px; }

/* ── UPLOAD ── */
#upload { padding: 0; }
.nav { padding: 52px 24px 16px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.back { width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
  border: 1px solid var(--border); color: var(--dim); font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav-title { font-size: 17px; font-weight: 400; }
.drop-zone { margin: 0 24px; border: 1.5px dashed rgba(200,169,110,0.3); border-radius: 16px;
  padding: 44px 24px; text-align: center; cursor: pointer; transition: all 0.2s; }
.drop-zone.drag, .drop-zone:active { background: rgba(200,169,110,0.06); border-color: var(--gold); }
.drop-icon { font-size: 38px; margin-bottom: 12px; }
.drop-title { font-size: 16px; color: var(--gold); margin-bottom: 6px; }
.drop-hint { font-size: 12px; color: var(--dim); line-height: 1.9; }
.upload-info { margin: 16px 24px 0; padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  display: flex; justify-content: space-between; align-items: center; }

/* ── INPUT CARDS ── */
#inputmode { padding: 0; background: #000; }
.card-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.card-img-area { position: relative; flex: 1; overflow: hidden; min-height: 0; }
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-overlay { position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.05) 50%, transparent 75%); }
.card-top { position: absolute; top: 0; left: 0; right: 0; padding: 52px 20px 12px;
  display: flex; justify-content: space-between; align-items: center; z-index: 5; }
.card-counter { font-size: 13px; color: rgba(255,255,255,0.45); }
.card-close { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 20px; cursor: pointer; }
.card-bottom { flex-shrink: 0; background: #0c0c0f; padding: 16px 20px max(24px, env(safe-area-inset-bottom)); }
.card-input-wrap { position: relative; }
.card-input {
  width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; padding: 14px 52px 14px 16px; color: var(--text);
  font-family: 'Noto Serif SC', serif; font-size: 16px; resize: none;
  line-height: 1.5; min-height: 52px; max-height: 120px;
  outline: none; transition: border-color 0.15s;
}
.card-input:focus { border-color: rgba(200,169,110,0.5); }
.card-input::placeholder { color: var(--dim); }
.card-submit {
  position: absolute; right: 10px; bottom: 10px;
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--gold); border: none; cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s;
}
.card-submit:disabled { opacity: 0.3; }
.skip-btn { margin-top: 10px; width: 100%; background: none; border: none;
  color: var(--dim); font-size: 13px; font-family: 'Noto Serif SC', serif;
  cursor: pointer; padding: 6px; }

/* progress dots */
.dots { display: flex; gap: 4px; justify-content: center; padding: 10px 20px 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.2s; }
.dot.done { background: var(--gold); }
.dot.active { background: rgba(255,255,255,0.6); }

/* ── TEXT LIST ── */
#textlist { padding: 0; }
.entries { padding: 0 24px; display: flex; flex-direction: column; }
.entry { padding: 16px 0; border-bottom: 1px solid var(--border); }
.entry-n { font-size: 10px; color: rgba(200,169,110,0.5); letter-spacing: 2px; margin-bottom: 5px; }
.entry-en { font-size: 15px; line-height: 1.55; margin-bottom: 4px; }
.entry-zh { font-size: 13px; color: var(--dim); font-weight: 300; line-height: 1.55; }
.entry-zh.loading { color: rgba(200,169,110,0.4); font-style: italic; }
.list-actions { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }

/* ── STORY ── */
#story { padding: 0; }
.story-body { padding: 0 24px; flex: 1; }
.chips-section { margin-bottom: 16px; }
.chip-label { font-size: 11px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--dim);
  font-family: 'Noto Serif SC', serif; transition: all 0.15s; }
.chip.on { background: rgba(200,169,110,0.12); border-color: var(--gold); color: var(--gold); }
.story-result { font-size: 15px; font-weight: 300; line-height: 2.1; white-space: pre-wrap; padding: 4px 0 40px; }
.shimmer-wrap { display: flex; flex-direction: column; gap: 10px; padding: 8px 0; }
.shimmer { height: 14px; border-radius: 4px;
  background: linear-gradient(90deg, #1a1a1f 25%, #252530 50%, #1a1a1f 75%);
  background-size: 200% 100%; animation: sh 1.4s infinite; }
@keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── DONE SCREEN ── */
#done { justify-content: center; align-items: center; padding: 48px 28px; gap: 24px; text-align: center; }
.done-emoji { font-size: 56px; }
.done-title { font-size: 24px; font-weight: 300; }
.done-sub { font-size: 14px; color: var(--dim); line-height: 1.8; }
.done-btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }

/* toast */
#toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: rgba(28,28,34,0.96); border: 1px solid var(--border); color: var(--text);
  font-size: 13px; padding: 10px 20px; border-radius: 30px; opacity: 0;
  transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 999; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.safe { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="toast"></div>
<div id="app">

<!-- HOME -->
<div class="screen active" id="home">
  <div class="logo">追剧<br>字幕收集</div>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="h-total">0</div><div class="stat-l">总收集</div></div>
    <div class="stat"><div class="stat-n" id="h-today" style="color:#7ab8d4">0</div><div class="stat-l">今日输入</div></div>
    <div class="stat"><div class="stat-n" id="h-days" style="color:#a78bfa">0</div><div class="stat-l">累计天数</div></div>
  </div>
  <div class="home-btns">
    <button class="btn btn-gold" id="btn-continue" onclick="continueToday()">继续今日输入</button>
    <button class="btn btn-dim" onclick="goTo('upload')">📸 上传新截图</button>
    <button class="btn btn-ghost" onclick="goTo('textlist'); renderList()">查看今日记录</button>
  </div>
  <div class="safe"></div>
</div>

<!-- UPLOAD -->
<div class="screen" id="upload">
  <div class="nav">
    <div class="back" onclick="goTo('home')">←</div>
    <span class="nav-title">上传截图</span>
  </div>
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('fin').click()">
    <input type="file" id="fin" accept="image/*" multiple style="display:none" onchange="loadImages(this.files)">
    <div class="drop-icon">🎬</div>
    <div class="drop-title">选择截图（最多25张）</div>
    <div class="drop-hint">选好后逐张显示<br>你手动输入每张的字幕<br>输入本身就是一次记忆</div>
  </div>
  <div class="upload-info">
    <span style="font-size:13px;color:var(--dim)">今日已上传</span>
    <span style="font-size:20px;color:var(--gold)" id="up-count">0</span>
  </div>
  <div class="safe"></div>
</div>

<!-- INPUT MODE -->
<div class="screen" id="inputmode">
  <div class="card-wrap" id="card-wrap">
    <!-- injected -->
  </div>
</div>

<!-- TEXT LIST -->
<div class="screen" id="textlist">
  <div class="nav" style="flex-shrink:0">
    <div class="back" onclick="goTo('home')">←</div>
    <span class="nav-title">今日字幕</span>
  </div>
  <div class="entries" id="entries"></div>
  <div class="list-actions">
    <button class="btn btn-gold" onclick="goTo('story'); resetStory()">✦ 用这些句子生成故事</button>
  </div>
  <div class="safe"></div>
</div>

<!-- STORY -->
<div class="screen" id="story">
  <div class="nav" style="flex-shrink:0">
    <div class="back" onclick="goTo('textlist')">←</div>
    <span class="nav-title">生成小故事</span>
  </div>
  <div class="story-body" id="story-body">
    <div id="story-config">
      <div class="chips-section">
        <div class="chip-label">场景</div>
        <div class="chips">
          <div class="chip on" data-g="scene">日常对话</div>
          <div class="chip" data-g="scene">职场</div>
          <div class="chip" data-g="scene">悬疑</div>
          <div class="chip" data-g="scene">浪漫</div>
          <div class="chip" data-g="scene">科幻</div>
        </div>
      </div>
      <div class="chips-section">
        <div class="chip-label">风格</div>
        <div class="chips">
          <div class="chip on" data-g="style">轻松幽默</div>
          <div class="chip" data-g="style">文艺感</div>
          <div class="chip" data-g="style">紧张刺激</div>
          <div class="chip" data-g="style">温情治愈</div>
        </div>
      </div>
      <div class="chips-section">
        <div class="chip-label">语言</div>
        <div class="chips">
          <div class="chip on" data-g="lang">中英双语</div>
          <div class="chip" data-g="lang">纯英文</div>
          <div class="chip" data-g="lang">纯中文</div>
        </div>
      </div>
      <button class="btn btn-gold" style="margin-top:8px" onclick="generateStory()">生成故事</button>
    </div>
    <div id="story-shimmer" class="shimmer-wrap" style="display:none">
      <div class="shimmer" style="width:88%"></div>
      <div class="shimmer" style="width:72%"></div>
      <div class="shimmer" style="width:82%"></div>
      <div class="shimmer" style="width:65%"></div>
      <div class="shimmer" style="width:79%"></div>
    </div>
    <div class="story-result" id="story-result"></div>
  </div>
  <div class="safe" style="flex-shrink:0"></div>
</div>

<!-- DONE -->
<div class="screen" id="done">
  <div class="done-emoji">🎉</div>
  <div class="done-title">今日完成！</div>
  <div class="done-sub" id="done-sub"></div>
  <div class="done-btns">
    <button class="btn btn-gold" onclick="goTo('textlist'); renderList()">查看今日字幕列表</button>
    <button class="btn btn-dim" onclick="goTo('story'); resetStory()">✦ 生成小故事</button>
    <button class="btn btn-ghost" onclick="goTo('home')">回主页</button>
  </div>
</div>

</div>

<script>
const DS_KEY = 'sk-4e126a125433427c97678d423a2f53e2';
const DS_URL = 'https://api.deepseek.com/v1/chat/completions';
const SKEY   = 'stv6';

// ── Storage ──────────────────────────────────────────────────────
async function load() {
  try { const r = await window.storage.get(SKEY); return r ? JSON.parse(r.value) : mk(); }
  catch { return mk(); }
}
async function persist() {
  try { await window.storage.set(SKEY, JSON.stringify(DB)); } catch(e){}
}
function mk() { return { allEntries:[], days:{} }; }

// ── State ─────────────────────────────────────────────────────────
let DB = null;
let todayKey = new Date().toLocaleDateString('zh-CN');
let session = { images:[], idx:0, entries:[] }; // current session

(async () => {
  DB = await load();
  if (!DB.days[todayKey]) DB.days[todayKey] = [];
  refreshHome();
})();

// ── Helpers ───────────────────────────────────────────────────────
function todayEntries() { return DB?.days?.[todayKey] || []; }
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'home') refreshHome();
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ── Home ──────────────────────────────────────────────────────────
function refreshHome() {
  if (!DB) return;
  const today = todayEntries();
  const total = DB.allEntries.length;
  const days  = Object.keys(DB.days).filter(d => DB.days[d].length > 0).length;
  document.getElementById('h-total').textContent = total;
  document.getElementById('h-today').textContent = today.length;
  document.getElementById('h-days').textContent  = days;

  const btn = document.getElementById('btn-continue');
  if (session.images.length > session.idx && session.idx > 0) {
    btn.textContent = `继续今日输入 (${session.idx}/${session.images.length})`;
    btn.style.opacity = '1';
  } else if (today.length > 0) {
    btn.textContent = `今日已输入 ${today.length} 条 ✓`;
    btn.style.opacity = '0.5';
  } else {
    btn.textContent = '暂无今日图片，先上传截图';
    btn.style.opacity = '0.4';
  }
}

function continueToday() {
  if (session.images.length === 0) { goTo('upload'); return; }
  goTo('inputmode');
  showCard(session.idx);
}

// ── Upload ────────────────────────────────────────────────────────
async function loadImages(files) {
  files = Array.from(files).slice(0, 25);
  if (!files.length) return;
  session = { images:[], idx:0, entries:[] };

  for (const f of files) {
    const b64 = await toB64(f);
    session.images.push({ src: `data:${f.type||'image/jpeg'};base64,${b64}`, name: f.name });
  }

  document.getElementById('up-count').textContent = session.images.length;
  toast(`已加载 ${session.images.length} 张，开始输入吧`);
  setTimeout(() => { goTo('inputmode'); showCard(0); }, 600);
}

function toB64(f) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

// ── Input Cards ───────────────────────────────────────────────────
function showCard(idx) {
  session.idx = idx;
  const total  = session.images.length;
  const img    = session.images[idx];
  const saved  = session.entries[idx] || '';

  // dots
  const dotsHtml = session.images.map((_,i) =>
    `<div class="dot ${i < idx ? 'done' : i === idx ? 'active' : ''}"></div>`
  ).join('');

  document.getElementById('card-wrap').innerHTML = `
    <div class="card-img-area">
      <img class="card-img" src="${img.src}" alt="">
      <div class="card-overlay"></div>
      <div class="card-top">
        <button class="card-close" onclick="goTo('home')">✕</button>
        <span class="card-counter">${idx+1} / ${total}</span>
        <div style="width:28px"></div>
      </div>
      <div class="dots">${dotsHtml}</div>
    </div>
    <div class="card-bottom">
      <div class="card-input-wrap">
        <textarea class="card-input" id="txt-input" placeholder="输入这张截图里的字幕…" rows="2"
          oninput="autoResize(this)">${saved}</textarea>
        <button class="card-submit" id="submit-btn" onclick="submitCard()">→</button>
      </div>
      <button class="skip-btn" onclick="skipCard()">跳过这张</button>
    </div>`;

  // focus input
  setTimeout(() => {
    const el = document.getElementById('txt-input');
    if (el) el.focus();
  }, 300);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function submitCard() {
  const txt = document.getElementById('txt-input').value.trim();
  if (!txt) { toast('请先输入字幕内容'); return; }

  session.entries[session.idx] = txt;

  // save entry
  const entry = { text: txt, img: session.images[session.idx].src, zh: '', ts: Date.now() };
  DB.days[todayKey].push(entry);
  DB.allEntries.push(entry);
  await persist();

  // translate in background (non-blocking)
  translateEntry(DB.days[todayKey].length - 1, txt);

  nextCard();
}

function skipCard() {
  session.entries[session.idx] = '';
  nextCard();
}

function nextCard() {
  const next = session.idx + 1;
  if (next >= session.images.length) {
    finishSession();
  } else {
    showCard(next);
  }
}

async function translateEntry(idx, txt) {
  try {
    const r = await fetch(DS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DS_KEY}` },
      body: JSON.stringify({
        model: 'deepseek-chat', max_tokens: 150,
        messages: [{ role: 'user', content:
          `翻译成中文，只返回翻译结果，不要任何解释：${txt}` }]
      })
    });
    const d = await r.json();
    const zh = d.choices?.[0]?.message?.content?.trim() || '';
    if (zh && DB.days[todayKey][idx]) {
      DB.days[todayKey][idx].zh = zh;
      DB.allEntries.find(e => e.ts === DB.days[todayKey][idx].ts && !e.zh && (e.zh = zh));
      await persist();
      // update list if visible
      const el = document.getElementById(`zh-${idx}`);
      if (el) { el.textContent = zh; el.classList.remove('loading'); }
    }
  } catch(e) {}
}

function finishSession() {
  const count = todayEntries().length;
  document.getElementById('done-sub').textContent = `今天输入了 ${count} 条字幕\n翻译正在后台完成…`;
  goTo('done');
}

// ── Text List ─────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('entries');
  const today = todayEntries();
  if (!today.length) {
    el.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--dim);font-size:14px">今日暂无记录</div>';
    return;
  }
  el.innerHTML = today.map((e,i) => `
    <div class="entry">
      <div class="entry-n">${String(i+1).padStart(2,'0')}</div>
      <div class="entry-en">${e.text}</div>
      <div class="entry-zh ${e.zh ? '' : 'loading'}" id="zh-${i}">${e.zh || '翻译中…'}</div>
    </div>`).join('');
}

// ── Story ─────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const g = chip.dataset.g;
  if (!g) return;
  document.querySelectorAll(`.chip[data-g="${g}"]`).forEach(c => c.classList.remove('on'));
  chip.classList.add('on');
});

function resetStory() {
  document.getElementById('story-config').style.display = 'block';
  document.getElementById('story-shimmer').style.display = 'none';
  document.getElementById('story-result').textContent = '';
}

async function generateStory() {
  const today = todayEntries();
  if (!today.length) { toast('今日没有字幕记录'); return; }

  const scene = document.querySelector('.chip.on[data-g="scene"]')?.textContent || '日常对话';
  const style = document.querySelector('.chip.on[data-g="style"]')?.textContent || '轻松幽默';
  const lang  = document.querySelector('.chip.on[data-g="lang"]')?.textContent  || '中英双语';

  const lines = today.map((e,i) => `${i+1}. ${e.text}${e.zh ? `（${e.zh}）` : ''}`).join('\n');

  document.getElementById('story-config').style.display = 'none';
  document.getElementById('story-shimmer').style.display = 'flex';
  document.getElementById('story-result').textContent = '';

  try {
    const r = await fetch(DS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DS_KEY}` },
      body: JSON.stringify({
        model: 'deepseek-chat', max_tokens: 1200,
        messages: [{ role: 'user', content:
`今天从影视剧截图里手动输入的字幕句子：
${lines}

请把这些句子自然地融入一个短故事。
场景：${scene}
风格：${style}
语言：${lang === '中英双语' ? '中英双语——每个段落先写英文，换行再写对应中文' : lang === '纯英文' ? '全程英文' : '全程中文'}

要求：真实融入原句，有起承转合，200-350字。直接开始写故事，不要标题和前言。` }]
      })
    });
    const d = await r.json();
    const txt = d.choices?.[0]?.message?.content || '生成失败，请重试';
    document.getElementById('story-shimmer').style.display = 'none';
    document.getElementById('story-result').textContent = txt;
  } catch(e) {
    document.getElementById('story-shimmer').style.display = 'none';
    document.getElementById('story-result').textContent = '网络错误，请重试';
    document.getElementById('story-config').style.display = 'block';
  }
}

// ── Drag drop ─────────────────────────────────────────────────────
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); loadImages(e.dataTransfer.files); });
</script>
</body>
</html>
